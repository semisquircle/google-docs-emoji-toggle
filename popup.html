
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Emoji Toggle Settings</title>
	<style>
		body {
			width: 240px;
			padding: 16px;
			margin: 0;
			font-family: system-ui, sans-serif;
			font-size: 14px;
		}

		.setting {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 12px;
		}

		.switch {
			position: relative;
			display: inline-block;
			width: 40px;
			height: 24px;
			flex-shrink: 0;
		}

		.switch input {
			opacity: 0;
			width: 0;
			height: 0;
		}

		.slider {
			position: absolute;
			cursor: pointer;
			inset: 0;
			background: #ccc;
			border-radius: 24px;
			transition: background 0.2s;
		}

		.slider::before {
			content: "";
			position: absolute;
			width: 18px;
			height: 18px;
			left: 3px;
			bottom: 3px;
			background: white;
			border-radius: 50%;
			transition: transform 0.2s;
		}

		input:checked + .slider {
			background: #34a853;
		}

		input:checked + .slider::before {
			transform: translateX(16px);
		}

		input:focus-visible + .slider {
			outline: 2px solid #1a73e8;
			outline-offset: 2px;
		}

		.description {
			margin-top: 12px;
			font-size: 12px;
			color: #666;
		}
	</style>
</head>

<body>
	<div class="setting">
		<strong>Enable Emoji Toggle</strong>

		<label class="switch">
			<input type="checkbox" id="enabled">
			<span class="slider"></span>
		</label>
	</div>

	<div class="description">
		Toggle selected ✅ and ❌ emojis with Cmd+Shift+Y.
	</div>

	<script src="popup.js"></script>
</body>
</html>
